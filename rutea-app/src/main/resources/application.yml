spring:
  application:
    name: rutea
  autoconfigure:
    # Sin base de datos la operación vive en memoria; el perfil postgres la guarda.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

server:
  port: 8080
  # El plan de Suba pesa 1,8 MB y el de las 20 localidades 4,3 MB; el WebSocket no pasa por aquí.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

rutea:
  # Relativo al directorio desde el que se lanza la app (mvn -pl rutea-app spring-boot:run corre en rutea-app/).
  # La vista de ciudad (GET /api/areas) y la operación en vivo de cada localidad van sobre el grafo de Bogotá.
  bogota-graph: ../data/osm/bogota.rgraph
  bogota-sites: ../data/osm/bogota-sitios-sensibles.csv
  operator-containers: ../data/ase
  # Arma Suba de noche apenas arranca, en otro hilo. Los tests lo apagan.
  warm-up: true
