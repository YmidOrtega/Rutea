version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # "npm" también cubre pnpm: Dependabot lee pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Igual que minimumReleaseAge en web/pnpm-workspace.yaml
    cooldown:
      default-days: 7
